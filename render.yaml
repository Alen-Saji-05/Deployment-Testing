databases:
  - name: product-store-db
    plan: free
    databaseName: product_store
    user: admin

services:
  - type: web
    name: product-store-api
    plan: free
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: product-store-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.6
